name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Safe, obviously-fake placeholders — not real credentials. No route is
    # currently statically prerendered with Supabase access, so these aren't
    # exercised at runtime today; they exist so a future page that does
    # touch Supabase during the build fails on its own logic instead of on
    # a missing-env-var error unrelated to what's actually being tested.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  regressions:
    name: Isolated workflow and isolation checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      # Owner approved generated disposable local CI accounts on 2026-11-21.
      AKADEX_CI_DISPOSABLE_AUTH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require approved disposable authentication
        run: node --input-type=module -e "import { assertDisposableCIAuth } from './e2e/ci-auth.ts'; assertDisposableCIAuth()"
      - name: Install dependencies and Chromium
        id: dependencies
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Provision isolated database
        id: database
        run: npm run e2e:db
      - name: Verify fresh and upgrade migrations
        run: npm run e2e:verify-db
      - name: Verify report aggregates
        run: npm run e2e:verify-analytics
      - name: Register disposable accounts, test login, and run workflows
        run: npm run e2e:ci
      - name: Clean disposable accounts and private states
        if: always() && steps.database.outcome == 'success'
        run: npm run e2e:ci:cleanup
      - name: Retain sanitized summaries only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-regression-summary
          path: |
            e2e/.cache/ci-summary.json
            e2e/.cache/isolation-summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated local services
        if: always() && steps.dependencies.outcome == 'success'
        run: npx --no-install supabase stop

  open-promotion-pr:
    name: Open promotion PR
    runs-on: ubuntu-latest
    needs: [quality, regressions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.quality.result == 'success' && needs.regressions.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: false

    steps:
      - name: Check for existing promotion PR
        id: existing-pr
        run: |
          pr_number="$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Promotion PR already exists: #$pr_number"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open promotion PR found."
          fi

      - name: Create promotion PR
        if: steps.existing-pr.outputs.exists == 'false'
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "Promote dev to main" \
            --body "Automated promotion PR. The CI quality checks on dev passed successfully for this push."
