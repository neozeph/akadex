name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Safe, obviously-fake placeholders — not real credentials. No route is
    # currently statically prerendered with Supabase access, so these aren't
    # exercised at runtime today; they exist so a future page that does
    # touch Supabase during the build fails on its own logic instead of on
    # a missing-env-var error unrelated to what's actually being tested.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  open-promotion-pr:
    name: Open promotion PR
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.quality.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: false

    steps:
      - name: Check for existing promotion PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Promotion PR already exists: #$pr_number"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open promotion PR found."
          fi

      - name: Create promotion PR
        if: steps.existing-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "Promote dev to main" \
            --body "Automated promotion PR. The CI quality checks on dev passed successfully for this push."
